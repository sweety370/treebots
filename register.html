<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TreeBots | إنشاء حساب</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 0%,#202020 0%,#111 45%,#050505 100%);
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  overflow:hidden;
}

/* BACKGROUND */

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.glow{
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  background:radial-gradient(circle,#fff1,transparent 70%);
  filter:blur(30px);
  animation:float 8s ease-in-out infinite;
}

.glow.one{
  top:-180px;
  right:-120px;
}

.glow.two{
  bottom:-220px;
  left:-140px;
  animation-delay:-4s;
}

@keyframes float{
  0%,100%{
    transform:translate(0,0) scale(1);
  }
  50%{
    transform:translate(20px,25px) scale(1.08);
  }
}

/* CARD */

.card{
  position:relative;
  width:min(450px,92%);
  padding:34px;
  border:1px solid #303030;
  border-radius:22px;
  background:rgba(20,20,20,.88);
  backdrop-filter:blur(20px);
  box-shadow:
    0 30px 100px #000b,
    inset 0 1px #ffffff0a;
  animation:cardIn .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* LOGO */

.logo{
  text-align:center;
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
  margin-bottom:7px;
}

.logo-mark{
  display:inline-grid;
  place-items:center;
  width:42px;
  height:42px;
  margin-left:7px;
  vertical-align:middle;
  border-radius:12px;
  border:1px solid #3a3a3a;
  background:linear-gradient(145deg,#292929,#0b0b0b);
  box-shadow:0 8px 25px #0008;
}

.logo span{
  color:#888;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:28px;
  font-size:14px;
}

/* FORM */

label{
  display:block;
  color:#d0d0d0;
  margin:15px 0 7px;
  font-size:14px;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;
  padding:14px 15px;
  border-radius:11px;
  border:1px solid #333;
  background:#101010;
  color:#fff;
  outline:none;
  transition:
    border-color .2s,
    box-shadow .2s,
    transform .2s;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#777;
  box-shadow:0 0 0 3px #ffffff08;
  transform:translateY(-1px);
}

/* BUTTON */

button{
  width:100%;
  margin-top:23px;
  padding:14px;
  border:1px solid #fff;
  border-radius:11px;
  background:#fff;
  color:#111;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:
    transform .2s,
    background .2s,
    box-shadow .2s;
}

button:hover{
  background:#e7e7e7;
  transform:translateY(-2px);
  box-shadow:0 10px 30px #fff2;
}

button:active{
  transform:translateY(0) scale(.98);
}

button.loading{
  opacity:.7;
  cursor:wait;
}

/* MESSAGE */

.msg{
  text-align:center;
  margin-top:15px;
  min-height:22px;
  color:#ff7777;
  font-size:14px;
}

/* LOGIN */

.login{
  text-align:center;
  color:#777;
  margin-top:22px;
  font-size:14px;
}

.login a{
  color:#fff;
  text-decoration:none;
  transition:color .2s;
}

.login a:hover{
  color:#aaa;
}

/* DIVIDER */

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:23px 0 0;
  color:#444;
  font-size:11px;
}

.divider::before,
.divider::after{
  content:"";
  height:1px;
  flex:1;
  background:#292929;
}

/* DISABLE ANIMATIONS */

.no-animations *,
.no-animations *::before,
.no-animations *::after{
  animation:none!important;
  transition:none!important;
}

/* MOBILE */

@media(max-width:500px){

  body{
    overflow:auto;
    padding:25px 0;
  }

  .card{
    padding:27px 22px;
  }

  .logo{
    font-size:27px;
  }
}
</style>

</head>

<body>

<div class="bg">
  <div class="glow one"></div>
  <div class="glow two"></div>
</div>

<div class="card">

  <div class="logo">
    <span class="logo-mark">T</span>
    Tree<span>Bots</span>
  </div>

  <div class="subtitle">
    إنشاء حساب جديد
  </div>

  <form id="registerForm">

```
<label for="fullName">
  الاسم بالكامل
</label>

<div class="input-wrap">
  <input
    id="fullName"
    type="text"
    placeholder="اكتب اسمك"
    required
    autocomplete="name"
  >
</div>


<label for="email">
  البريد الإلكتروني
</label>

<div class="input-wrap">
  <input
    id="email"
    type="email"
    placeholder="example@email.com"
    required
    autocomplete="email"
  >
</div>


<label for="password">
  كلمة المرور
</label>

<div class="input-wrap">
  <input
    id="password"
    type="password"
    placeholder="6 أحرف على الأقل"
    required
    minlength="6"
    autocomplete="new-password"
  >
</div>


<label for="confirmPassword">
  تأكيد كلمة المرور
</label>

<div class="input-wrap">
  <input
    id="confirmPassword"
    type="password"
    placeholder="أعد كتابة كلمة المرور"
    required
    minlength="6"
    autocomplete="new-password"
  >
</div>


<button id="registerButton" type="submit">
  إنشاء الحساب
</button>
```

  </form>

  <div id="msg" class="msg"></div>

  <div class="login">
    لديك حساب بالفعل؟
    <a href="login.html">تسجيل الدخول</a>
  </div>

  <div class="divider">
    TreeBots
  </div>

</div>

<script>

const API =
  "https://treebots-backend.505omerfive.workers.dev";


const form =
  document.getElementById("registerForm");

const msg =
  document.getElementById("msg");

const button =
  document.getElementById("registerButton");


form.addEventListener("submit", async e => {

  e.preventDefault();

  const fullName =
    document.getElementById("fullName")
      .value.trim();

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const confirmPassword =
    document.getElementById("confirmPassword")
      .value;


  msg.textContent =
    "جاري إنشاء الحساب...";

  msg.style.color =
    "#aaa";

  button.classList.add("loading");

  button.disabled = true;


  if(password !== confirmPassword){

    msg.textContent =
      "كلمتا المرور غير متطابقتين";

    msg.style.color =
      "#ff7777";

    button.classList.remove("loading");

    button.disabled = false;

    return;
  }


  if(password.length < 6){

    msg.textContent =
      "كلمة المرور يجب أن تكون 6 أحرف على الأقل";

    msg.style.color =
      "#ff7777";

    button.classList.remove("loading");

    button.disabled = false;

    return;
  }


  try{

    const res =
      await fetch(
        `${API}/api/auth/register`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            fullName,
            email,
            password,
            confirmPassword
          })
        }
      );


    const data =
      await res.json();


    if(!res.ok){

      throw new Error(
        data.error ||
        "حدث خطأ أثناء إنشاء الحساب"
      );

    }


    /*
      البريد المستخدم في التحقق
    */

    sessionStorage.setItem(
      "verifyEmail",
      email
    );


    /*
      لو الـBackend الحالي
      يرجع كود التحقق.
    */

    if(data.verificationCode){

      sessionStorage.setItem(
        "verificationCode",
        data.verificationCode
      );

    }


    msg.textContent =
      "تم إنشاء الحساب بنجاح";

    msg.style.color =
      "#9cff9c";


    setTimeout(() => {

      window.location.href =
        "verify.html";

    },700);


  }catch(err){

    msg.textContent =
      err.message ||
      "حدث خطأ غير متوقع";

    msg.style.color =
      "#ff7777";

  }


  button.classList.remove("loading");

  button.disabled = false;

});


/*
  Enter داخل أي input
  يعمل بشكل طبيعي.
*/

document
  .querySelectorAll("input")
  .forEach(input => {

    input.addEventListener(
      "keydown",
      e => {

        if(e.key === "Enter"){

          e.preventDefault();

          form.requestSubmit();

        }

      }
    );

  });

</script>

</body>
</html>

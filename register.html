<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TreeBots | إنشاء حساب</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#171717;
  color:#fff;
  font-family:Arial,sans-serif;
}
.card{
  width:min(430px,92%);
  background:#222;
  border:1px solid #333;
  border-radius:20px;
  padding:32px;
  box-shadow:0 20px 60px #0008;
}
.logo{text-align:center;font-size:30px;font-weight:800;margin-bottom:8px}
.logo span{color:#aaa}
.subtitle{text-align:center;color:#999;margin-bottom:28px}
label{display:block;color:#ccc;margin:14px 0 7px}
input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid #3a3a3a;
  background:#151515;
  color:white;
  outline:none;
}
input:focus{border-color:#777}
button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#ddd}
.msg{text-align:center;margin-top:16px;color:#ff7777;min-height:22px}
.login{text-align:center;color:#999;margin-top:20px}
a{color:#fff;text-decoration:none}
</style>
</head>

<body>
<div class="card">
  <div class="logo">🌳 Tree<span>Bots</span></div>
  <div class="subtitle">إنشاء حساب جديد</div>

  <form id="registerForm">

    <label>الاسم بالكامل</label>
    <input id="fullName" type="text" required autocomplete="name">

    <label>البريد الإلكتروني</label>
    <input id="email" type="email" required autocomplete="email">

    <label>كلمة المرور</label>
    <input id="password" type="password" required minlength="6" autocomplete="new-password">

    <label>تأكيد كلمة المرور</label>
    <input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password">

    <button type="submit">إنشاء الحساب</button>
  </form>

  <div id="msg" class="msg"></div>

  <div class="login">
    لديك حساب بالفعل؟
    <a href="login.html">تسجيل الدخول</a>
  </div>
</div>

<script>
const API = "https://treebots-backend.505omerfive.workers.dev";

document.getElementById("registerForm").addEventListener("submit", async e => {
  e.preventDefault();

  const msg = document.getElementById("msg");
  msg.textContent = "جاري إنشاء الحساب...";
  msg.style.color = "#aaa";

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if(password !== confirmPassword){
    msg.textContent = "كلمتا المرور غير متطابقتين";
    msg.style.color = "#ff7777";
    return;
  }

  try{
    const res = await fetch(`${API}/api/auth/register`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        fullName,
        email,
        password,
        confirmPassword
      })
    });

    const data = await res.json();

    if(!res.ok){
      throw new Error(data.error || "حدث خطأ");
    }

    /*
      مؤقتًا نحفظ بيانات التحقق للانتقال
      إلى صفحة verify.html.
    */
    sessionStorage.setItem("verifyEmail", email);

    /*
      الـWorker الحالي يرجع الكود في الاستجابة.
      سيتم استبدال ذلك لاحقًا بإرسال الكود للإيميل فعليًا.
    */
    if(data.verificationCode){
      sessionStorage.setItem(
        "verificationCode",
        data.verificationCode
      );
    }

    window.location.href = "verify.html";

  }catch(err){
    msg.textContent = err.message;
    msg.style.color = "#ff7777";
  }
});
</script>
</body>
</html>

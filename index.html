<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TreeBots</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#171717;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  height:70px;
  background:#202020;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#999;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  color:#ccc;
}

.logout{
  border:0;
  background:#333;
  color:#fff;
  padding:9px 14px;
  border-radius:9px;
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:35px 20px;
}

.welcome{
  margin-bottom:30px;
}

.welcome h1{
  margin:0 0 8px;
  font-size:32px;
}

.welcome p{
  color:#999;
  margin:0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:30px;
}

.stat{
  background:#222;
  border:1px solid #333;
  border-radius:16px;
  padding:22px;
}

.stat-title{
  color:#999;
  font-size:14px;
}

.stat-value{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

.section{
  background:#222;
  border:1px solid #333;
  border-radius:18px;
  padding:24px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.section-head h2{
  margin:0;
}

.add{
  border:0;
  background:#fff;
  color:#111;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.bots{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:16px;
}

.bot{
  background:#181818;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
}

.bot-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.bot-name{
  font-size:19px;
  font-weight:bold;
}

.status{
  font-size:12px;
  padding:5px 9px;
  border-radius:20px;
  background:#333;
  color:#aaa;
}

.status.online{
  color:#fff;
  background:#343434;
}

.info{
  margin-top:18px;
  color:#aaa;
  line-height:1.9;
  font-size:14px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.actions button{
  flex:1;
  border:1px solid #444;
  background:#252525;
  color:#fff;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
}

.actions button:hover{
  background:#333;
}

.empty{
  text-align:center;
  padding:45px 10px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:min(430px,100%);
  background:#222;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
}

.modal-box h2{
  margin-top:0;
}

.modal-box input{
  width:100%;
  margin:7px 0;
  padding:13px;
  border-radius:10px;
  border:1px solid #444;
  background:#151515;
  color:#fff;
  outline:none;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.modal-actions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

.create{
  background:#fff;
  color:#111;
}

.cancel{
  background:#333;
  color:#fff;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr;
  }

  header{
    padding:0 15px;
  }

  .user-name{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🌳 Tree<span>Bots</span></div>

  <div class="user">
    <span class="user-name" id="userName">...</span>
    <button class="logout" onclick="logout()">خروج</button>
  </div>
</header>

<main class="container">

  <div class="welcome">
    <h1 id="welcome">مرحبًا 👋</h1>
    <p>إدارة بوتات Minecraft الخاصة بك من مكان واحد.</p>
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">إجمالي البوتات</div>
      <div class="stat-value" id="totalBots">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">البوتات المتصلة</div>
      <div class="stat-value" id="onlineBots">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">حالة الخدمة</div>
      <div class="stat-value">Online</div>
    </div>

  </div>

  <section class="section">

    <div class="section-head">
      <h2>My Bots</h2>
      <button class="add" onclick="openModal()">+ إضافة بوت</button>
    </div>

    <div id="bots" class="bots"></div>

  </section>

</main>


<div id="modal" class="modal">

  <div class="modal-box">

    <h2>إضافة بوت</h2>

    <input id="botName" placeholder="اسم البوت">

    <input id="username" placeholder="Minecraft Username">

    <input id="ip" placeholder="Server IP">

    <input id="port" placeholder="Port" value="25565">

    <input id="version" placeholder="Version" value="1.21.x">

    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">إلغاء</button>
      <button class="create" onclick="createBot()">إنشاء</button>
    </div>

  </div>

</div>


<script>

const API = "https://treebots-backend.505omerfive.workers.dev";

const token = localStorage.getItem("treebots_token");

if(!token){
  window.location.href = "login.html";
}


function authHeaders(){
  return {
    "Content-Type":"application/json",
    "Authorization":"Bearer " + token
  };
}


async function loadUser(){

  try{

    const res = await fetch(
      API + "/api/auth/me",
      {
        headers:authHeaders()
      }
    );

    if(!res.ok){
      localStorage.removeItem("treebots_token");
      localStorage.removeItem("treebots_user");
      window.location.href="login.html";
      return;
    }

    const data = await res.json();

    document.getElementById("userName").textContent =
      data.user.fullName;

    document.getElementById("welcome").textContent =
      "مرحبًا، " + data.user.fullName + " 👋";

  }catch(e){

    console.error(e);

  }
}


async function loadBots(){

  const container =
    document.getElementById("bots");

  container.innerHTML =
    '<div class="empty">جاري تحميل البوتات...</div>';

  try{

    const res = await fetch(
      API + "/api/bots",
      {
        headers:authHeaders()
      }
    );

    if(res.status === 401){
      logout();
      return;
    }

    const bots = await res.json();

    document.getElementById("totalBots").textContent =
      bots.length;

    document.getElementById("onlineBots").textContent =
      bots.filter(b => b.status === "online").length;

    if(!bots.length){

      container.innerHTML =
        '<div class="empty">لا توجد بوتات حتى الآن.<br>أضف أول بوت 🚀</div>';

      return;
    }

    container.innerHTML =
      bots.map(bot => `

        <div class="bot">

          <div class="bot-top">

            <div class="bot-name">
              🤖 ${escapeHtml(bot.name)}
            </div>

            <div class="status ${bot.status === "online" ? "online" : ""}">
              ${bot.status}
            </div>

          </div>

          <div class="info">

            👤 Username:
            ${escapeHtml(bot.username)}
            <br>

            🌐 Server:
            ${escapeHtml(bot.ip)}:${escapeHtml(bot.port)}
            <br>

            🎮 Version:
            ${escapeHtml(bot.version)}
            <br>

            📡 Ping:
            ${escapeHtml(bot.ping)}
            <br>

            ⏱️ Uptime:
            ${escapeHtml(bot.uptime)}

          </div>

          <div class="actions">

            <button onclick="toggleBot(
              '${bot.id}',
              '${bot.status === "online" ? "offline" : "online"}'
            )">
              ${bot.status === "online" ? "إيقاف" : "تشغيل"}
            </button>

            <button onclick="deleteBot('${bot.id}')">
              حذف
            </button>

          </div>

        </div>

      `).join("");

  }catch(e){

    container.innerHTML =
      '<div class="empty">حدث خطأ أثناء تحميل البوتات.</div>';

    console.error(e);

  }
}


async function createBot(){

  const name =
    document.getElementById("botName").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const ip =
    document.getElementById("ip").value.trim();

  const port =
    document.getElementById("port").value.trim();

  const version =
    document.getElementById("version").value.trim();

  if(!name){

    alert("اكتب اسم البوت");

    return;
  }

  try{

    const res = await fetch(
      API + "/api/bots",
      {
        method:"POST",
        headers:authHeaders(),
        body:JSON.stringify({
          name,
          username,
          ip,
          port,
          version
        })
      }
    );

    const data = await res.json();

    if(!res.ok){

      alert(data.error || "حدث خطأ");

      return;
    }

    closeModal();

    document.getElementById("botName").value="";
    document.getElementById("username").value="";
    document.getElementById("ip").value="";
    document.getElementById("port").value="25565";
    document.getElementById("version").value="1.21.x";

    loadBots();

  }catch(e){

    alert("تعذر الاتصال بالسيرفر");

  }
}


async function toggleBot(id,status){

  try{

    const res = await fetch(
      API + "/api/bots/" + id + "/status",
      {
        method:"POST",
        headers:authHeaders(),
        body:JSON.stringify({status})
      }
    );

    const data = await res.json();

    if(!res.ok){

      alert(data.error || "حدث خطأ");

      return;
    }

    loadBots();

  }catch(e){

    alert("تعذر الاتصال بالسيرفر");

  }
}


async function deleteBot(id){

  if(!confirm("هل تريد حذف هذا البوت؟")) return;

  try{

    const res = await fetch(
      API + "/api/bots/" + id,
      {
        method:"DELETE",
        headers:authHeaders()
      }
    );

    const data = await res.json();

    if(!res.ok){

      alert(data.error || "حدث خطأ");

      return;
    }

    loadBots();

  }catch(e){

    alert("تعذر الاتصال بالسيرفر");

  }
}


async function logout(){

  try{

    await fetch(
      API + "/api/auth/logout",
      {
        method:"POST",
        headers:authHeaders()
      }
    );

  }catch(e){}

  localStorage.removeItem("treebots_token");
  localStorage.removeItem("treebots_user");

  window.location.href="login.html";
}


function openModal(){
  document.getElementById("modal").style.display="flex";
}


function closeModal(){
  document.getElementById("modal").style.display="none";
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


loadUser();
loadBots();

</script>

</body>
</html>

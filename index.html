<script>
const AI_API = "https://treebots-backend.505omerfive.workers.dev";

async function sendMessage() {
  const input = document.getElementById("aiInput");
  const chat = document.getElementById("chat");

  const text = input.value.trim();

  if (!text) return;

  // رسالة المستخدم
  const userMessage = document.createElement("div");
  userMessage.className = "message user-message";
  userMessage.textContent = text;

  chat.appendChild(userMessage);

  input.value = "";
  input.disabled = true;

  // رسالة انتظار
  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai-message";
  aiMessage.textContent = "جاري التفكير...";

  chat.appendChild(aiMessage);
  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch(`${AI_API}/api/ai/chat`, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "حدث خطأ أثناء الاتصال بالـAI"
      );
    }

    aiMessage.textContent =
      data.reply || "لم يصل رد من الـAI.";

  } catch (error) {

    aiMessage.textContent =
      "حصل خطأ في الاتصال بالـAI.";

    console.error(error);

  } finally {

    input.disabled = false;
    input.focus();

    chat.scrollTop = chat.scrollHeight;
  }
}


document
  .getElementById("aiInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();
    }

  });
</script>

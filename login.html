```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TreeBots | تسجيل الدخول</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
}

/* الخلفية */

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.grid{
  position:absolute;
  inset:-100px;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:48px 48px;
  transform:perspective(600px) rotateX(55deg) scale(1.5);
  transform-origin:center bottom;
  animation:gridMove 12s linear infinite;
}

.glow{
  position:absolute;
  width:500px;
  height:500px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(
    circle,
    rgba(255,255,255,.10),
    transparent 68%
  );
  filter:blur(20px);
  animation:pulse 5s ease-in-out infinite;
}

@keyframes gridMove{
  from{background-position:0 0,0 0}
  to{background-position:0 48px,48px 0}
}

@keyframes pulse{
  0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
}

/* الكارت */

.card{
  position:relative;
  z-index:2;
  width:min(430px,92%);
  padding:34px;
  background:rgba(8,8,8,.82);
  border:1px solid #292929;
  border-radius:18px;
  box-shadow:
    0 30px 100px rgba(0,0,0,.8),
    0 0 50px rgba(255,255,255,.025);
  backdrop-filter:blur(20px);
  animation:cardIn .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* اللوجو */

.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:8px;
  font-size:27px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:1px solid #333;
  background:#111;
}

.logo-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logo span{
  color:#777;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:30px;
}

/* الحقول */

.field{
  margin-bottom:18px;
}

label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin-bottom:8px;
}

.input-wrap{
  position:relative;
}

.input-wrap img{
  position:absolute;
  right:13px;
  top:50%;
  width:18px;
  height:18px;
  transform:translateY(-50%);
  opacity:.45;
  pointer-events:none;
}

input{
  width:100%;
  height:48px;
  padding:0 43px 0 13px;
  border-radius:10px;
  border:1px solid #292929;
  background:#0d0d0d;
  color:#fff;
  outline:none;
  transition:.25s;
}

input::placeholder{
  color:#555;
}

input:hover{
  border-color:#3b3b3b;
}

input:focus{
  border-color:#666;
  box-shadow:0 0 0 3px rgba(255,255,255,.035);
}

/* الزر */

button{
  width:100%;
  height:48px;
  margin-top:7px;
  border:1px solid #fff;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  background:#ddd;
  transform:translateY(-1px);
  box-shadow:0 10px 30px rgba(255,255,255,.08);
}

button:active{
  transform:translateY(0) scale(.99);
}

/* رسالة الخطأ */

.msg{
  min-height:21px;
  text-align:center;
  margin-top:15px;
  font-size:13px;
}

/* الروابط */

.links{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
  font-size:13px;
}

.links a{
  color:#777;
  text-decoration:none;
  transition:.2s;
}

.links a:hover{
  color:#fff;
}

.register{
  text-align:center;
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid #202020;
  color:#666;
  font-size:13px;
}

.register a{
  color:#fff;
  text-decoration:none;
  font-weight:600;
}

.register a:hover{
  text-decoration:underline;
}

/* خط سفلي */

.status{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:22px;
  color:#555;
  font-size:11px;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#777;
  box-shadow:0 0 10px #777;
}

/* الموبايل */

@media(max-width:500px){
  .card{
    padding:27px 22px;
  }
}
</style>
</head>

<body>

<div class="bg">
  <div class="grid"></div>
  <div class="glow"></div>
</div>

<div class="card">

  <div class="logo">
    <div class="logo-icon">
      <img
        src="https://api.dicebear.com/9.x/shapes/svg?seed=TreeBots"
        alt="TreeBots"
      >
    </div>

    Tree<span>Bots</span>
  </div>

  <div class="subtitle">
    تسجيل الدخول إلى حسابك
  </div>

  <form id="loginForm">

    <div class="field">
      <label for="email">البريد الإلكتروني</label>

      <div class="input-wrap">
        <img
          src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/mail.svg"
          alt=""
        >

        <input
          id="email"
          type="email"
          placeholder="example@email.com"
          required
          autocomplete="email"
        >
      </div>
    </div>

    <div class="field">
      <label for="password">كلمة المرور</label>

      <div class="input-wrap">
        <img
          src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/lock.svg"
          alt=""
        >

        <input
          id="password"
          type="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>
    </div>

    <button id="loginButton" type="submit">
      تسجيل الدخول
    </button>

  </form>

  <div id="msg" class="msg"></div>

  <div class="links">
    <a href="recover.html">استرداد الحساب</a>
    <a href="register.html">إنشاء حساب</a>
  </div>

  <div class="register">
    ليس لديك حساب؟
    <a href="register.html">إنشاء حساب جديد</a>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    TreeBots Secure Login
  </div>

</div>

<script>

const API = "https://treebots-backend.505omerfive.workers.dev";

const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async e => {

  e.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password) return;

  msg.textContent = "جاري تسجيل الدخول...";
  msg.style.color = "#888";

  button.disabled = true;
  button.textContent = "جاري الدخول...";

  try{

    const res = await fetch(
      `${API}/api/auth/login`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data = await res.json();

    if(!res.ok){
      throw new Error(
        data.error ||
        "بيانات الدخول غير صحيحة"
      );
    }

    localStorage.setItem(
      "treebots_token",
      data.token
    );

    localStorage.setItem(
      "treebots_user",
      JSON.stringify(data.user)
    );

    msg.textContent = "تم تسجيل الدخول ✓";
    msg.style.color = "#aaa";

    button.textContent = "تم الدخول ✓";

    setTimeout(() => {
      window.location.href = "index.html";
    },500);

  }catch(err){

    msg.textContent =
      err.message ||
      "حدث خطأ أثناء تسجيل الدخول";

    msg.style.color = "#ff7777";

    button.disabled = false;
    button.textContent = "تسجيل الدخول";
  }

});

</script>

</body>
</html>

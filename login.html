<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TreeBots | تسجيل الدخول</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#171717;
  color:#fff;
  font-family:Arial,sans-serif;
}
.card{
  width:min(430px,92%);
  background:#222;
  border:1px solid #333;
  border-radius:20px;
  padding:32px;
  box-shadow:0 20px 60px #0008;
}
.logo{text-align:center;font-size:30px;font-weight:800;margin-bottom:8px}
.logo span{color:#aaa}
.subtitle{text-align:center;color:#999;margin-bottom:28px}
label{display:block;color:#ccc;margin:14px 0 7px}
input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid #3a3a3a;
  background:#151515;
  color:white;
  outline:none;
}
input:focus{border-color:#777}
button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#ddd}
.msg{text-align:center;margin-top:16px;color:#ff7777;min-height:22px}
.register{text-align:center;color:#999;margin-top:20px}
a{color:#fff;text-decoration:none}
</style>
</head>

<body>
<div class="card">
  <div class="logo">🌳 Tree<span>Bots</span></div>
  <div class="subtitle">تسجيل الدخول</div>

  <form id="loginForm">

    <label>البريد الإلكتروني</label>
    <input id="email" type="email" required autocomplete="email">

    <label>كلمة المرور</label>
    <input id="password" type="password" required autocomplete="current-password">

    <button type="submit">تسجيل الدخول</button>
  </form>

  <div id="msg" class="msg"></div>

  <div class="register">
    ليس لديك حساب؟
    <a href="register.html">إنشاء حساب</a>
  </div>
</div>

<script>
const API = "https://treebots-backend.505omerfive.workers.dev";

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const msg = document.getElementById("msg");
  msg.textContent = "جاري تسجيل الدخول...";
  msg.style.color = "#aaa";

  try{
    const res = await fetch(`${API}/api/auth/login`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email:document.getElementById("email").value.trim(),
        password:document.getElementById("password").value
      })
    });

    const data = await res.json();

    if(!res.ok){
      throw new Error(data.error || "بيانات الدخول غير صحيحة");
    }

    localStorage.setItem("treebots_token",data.token);
    localStorage.setItem("treebots_user",JSON.stringify(data.user));

    window.location.href = "index.html";

  }catch(err){
    msg.textContent = err.message;
    msg.style.color = "#ff7777";
  }
});
</script>
</body>
</html>
